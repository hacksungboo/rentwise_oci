name: cd

# main 에 병합되면: 테스트 → ARM64 이미지 빌드 → GHCR 저장 → team-4-1 배포(실패 시 자동 롤백)
on:
  push:
    branches: [main]
  workflow_dispatch:      # Actions 화면에서 수동 재배포

concurrency:
  group: deploy-production
  cancel-in-progress: false   # 배포 도중 끊지 않고 순서대로

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: hacksungboo

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-24.04-arm      # 서버와 같은 aarch64 네이티브 빌드
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: app
            file: app/backend/Dockerfile
          - name: web
            context: app/frontend
            file: app/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 빌드·푸시 (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          build-args: BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/rentwise-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/rentwise-${{ matrix.name }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH 준비
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: team-4-1 배포
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$USER@$HOST" \
            "SHA=$SHA GHCR_USER=$GHCR_USER GHCR_TOKEN=$GHCR_TOKEN bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/rentwise_oci
          git fetch --quiet origin
          git checkout --quiet --detach "$SHA"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          cd infra && ./scripts/deploy-image.sh "$SHA"
          REMOTE

      - name: 공개 주소 확인
        run: |
          for i in $(seq 1 12); do
            v="$(curl -fsS https://rentwise.ccmall.shop/api/v1/version || true)"
            echo "$v" | grep -q "${{ github.sha }}" && { echo "✓ $v"; exit 0; }
            sleep 5
          done
          echo "✗ 공개 주소에서 새 버전이 확인되지 않습니다"; exit 1
