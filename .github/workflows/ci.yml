name: ci

on:
  pull_request:
  workflow_call:   # cd.yml 이 배포 전에 같은 검사를 재사용

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: app/backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: app/frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose 문법 검사
        working-directory: infra
        run: |
          cp .env.example .env
          sed -i 's/^ORACLE_PASSWORD=.*/ORACLE_PASSWORD=x/; s/^DB_PASSWORD=.*/DB_PASSWORD=x/; s/^SESSION_SECRET=.*/SESSION_SECRET=x/; s/^CLOUDFLARE_TUNNEL_TOKEN=.*/CLOUDFLARE_TUNNEL_TOKEN=x/' .env
          docker compose config -q
      - run: bash -n infra/scripts/*.sh

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform/tokyo-dr } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate

  monitoring:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/monitoring } }
    steps:
      - uses: actions/checkout@v4
      - name: 모니터링 스택 기동·쿼리 시험
        run: |
          printf 'COMPOSE_PROFILES=server,agent\nHOST_LABEL=ci\nMON_HOST=127.0.0.1\nGRAFANA_ADMIN_PASSWORD=ci-test-pass\nGRAFANA_COOKIE_SECURE=false\nPROBE_URL=http://127.0.0.1:3000/api/health\n' > .env
          docker compose config -q
          docker compose up -d --quiet-pull
          docker run -d --name rentwise-api alpine:3.20 sh -c 'while true; do echo "2026-10-17 00:00:00,000 INFO rentwise.ai ai.interpret request=REQ-1 mode=real model=m status=OK code=- attempts=1 tokens_in=1582 cached=0 tokens_out=219 latency_ms=3293 provider_id=x"; sleep 5; done'
          docker run -d --name rentwise-web alpine:3.20 sh -c 'while true; do echo "10.0.0.1 - - [17/Oct/2026:00:00:00 +0000] \"GET /api/v1/version HTTP/1.1\" 200 120 \"-\" \"curl\""; sleep 5; done'
          for i in $(seq 1 36); do
            curl -fs localhost:9090/-/ready >/dev/null && curl -fs localhost:3100/ready >/dev/null && curl -fs localhost:3000/api/health >/dev/null && break
            sleep 5
          done
          sleep 75
          python3 ci_check.py ci || { docker compose logs --tail 60; exit 1; }
      - name: 실패 시 로그
        if: failure()
        run: docker compose logs --tail 200
